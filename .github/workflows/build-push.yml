name: Build and push image

# Phase 1, step 3: build, smoke test, then push to GHCR.
# The smoke test runs before the push, so a broken image never gets published.
#
# Triggers:
#   - pushing a tag matching v* (the normal release path)
#   - manual dispatch with an explicit tag (for one-off or POC builds)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.8.4-poc)"
        required: true
        default: v1.8.4-poc

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "Invalid tag: '$TAG'" >&2
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Disk space before build
        run: df -h /

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase path.
          images: ghcr.io/ucdavisiet/sf-pipelines
          # type=ref,event=tag publishes the git tag verbatim. Deliberately not
          # type=semver: a semver pattern silently produces no tag for anything
          # that does not parse as semver (e.g. "v1.8"), and both Bitbucket
          # pipelines pin exact tags, so verbatim is what we want.
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=sf-pipelines
            org.opencontainers.image.description=SiteFarm CI runner image for Bitbucket Pipelines (PHP 8.3, Apache, Chromium, Composer)
          # Never publish :latest — consumers pin exact tags.
          flavor: |
            latest=false

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .ci/docker-image/Dockerfile
          # Bitbucket Pipelines runs x86_64. ubuntu-latest is amd64, so this is
          # a native build with no QEMU emulation.
          platforms: linux/amd64
          # Load into the local daemon so the smoke test runs against the exact
          # image that will be pushed. Attestations are disabled because the
          # docker exporter cannot load a manifest list, and a plain single
          # manifest is what the Bitbucket runner wants anyway.
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image size
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: docker image ls "$(printf '%s\n' "$TAGS" | head -1)" --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Smoke test
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: ./test/smoke.sh "$(printf '%s\n' "$TAGS" | head -1)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s\n' "$TAGS" | while read -r ref; do
            [ -n "$ref" ] || continue
            echo "Pushing $ref"
            docker push "$ref"
          done

      - name: Published digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          ref="$(printf '%s\n' "$TAGS" | head -1)"
          docker image inspect "$ref" --format 'digest: {{index .RepoDigests 0}}'
          docker buildx imagetools inspect "$ref" || true

      - name: Disk space after build
        run: df -h /
